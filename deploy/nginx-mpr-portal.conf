# nginx server block for the MPR portal.
#
#   sudo cp deploy/nginx-mpr-portal.conf /etc/nginx/conf.d/mpr-portal.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Plain HTTP. Passwords cross the network in clear text, which is only tolerable
# on a trusted internal segment — see the README before exposing this further.

server {
    listen 80;
    listen [::]:80;

    # Every name and address people will type. Django's ALLOWED_HOSTS must list
    # the same ones, or matching requests here still get a 400 from Django.
    server_name mpr.local 192.168.1.42;

    # Award photos. Django's own limit is separate; if this is smaller, uploads
    # fail at nginx with a 413 before Django ever sees them.
    client_max_body_size 10M;

    location /static/ {
        alias /srv/mpr_portal/mpr_raj/staticfiles/;
        access_log off;
        # Hashed names are not in use, so keep this short enough that a CSS change
        # actually reaches people.
        expires 1h;
    }

    location /media/ {
        alias /srv/mpr_portal/mpr_raj/media/;
        access_log off;
        expires 1h;

        # User-uploaded files served from the application's own origin. Django's
        # ImageField already rejects anything Pillow cannot open, so this is the
        # second line: stop a browser sniffing a stored file as HTML and running
        # it as same-origin script.
        add_header X-Content-Type-Options "nosniff" always;

        # No PHP or CGI handler is defined for this location, so nothing here is
        # executed. Do not add one.
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_redirect off;

        proxy_set_header Host $host;

        # OVERWRITE, never $proxy_add_x_forwarded_for. That variable appends to
        # whatever the client sent, so a client could prepend a forged address and
        # choose what the security log records about it. $remote_addr is the peer
        # nginx actually accepted the connection from and cannot be spoofed.
        #
        # This is the half of the pair that makes AXES_IPWARE_PROXY_COUNT=1 safe.
        # Both must be true together; see the README.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The PDF export is the slow path and can outrun the 60s default.
        proxy_read_timeout 120s;
    }
}
